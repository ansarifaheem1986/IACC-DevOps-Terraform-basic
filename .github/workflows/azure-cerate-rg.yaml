name: Create Azure training resource group

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - stage
          - prod
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Sign in to Azure using a service principal
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}

      - name: Call the Azure CLI script
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run:
          chmod +x .github/scripts/create-resource-group.sh  
          bash .github/scripts/create-resource-group.sh
